name: Build FilmStream APK V5 (Android Permanen)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Periksa Android permanen
        shell: bash
        run: |
          test -s lib/main.dart
          test -f android/gradle/wrapper/gradle-wrapper.properties || { echo 'Struktur Android lengkap belum ada. Jalankan workflow migrasi satu kali dahulu.'; exit 1; }
          test -f android/app/build.gradle.kts -o -f android/app/build.gradle
      - name: Install dependensi dan cek sintaks
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test test/search_suggestions_test.dart
          flutter test test/age_verification_callback_test.dart
          flutter test test/catalog_numbered_pagination_test.dart
          flutter test test/filter_completed_pages_test.dart
          dart format --output=none lib/main.dart lib/source_manager.dart lib/web_source_page.dart
      - name: Generate Film Streaming Android icon
        run: |
          python -m pip install 'Pillow==11.3.0'
          python tools/generate_android_icons.py
      - name: Restore persistent release signing keystore
        env:
          FILMSTREAM_KEYSTORE_BASE64: ${{ secrets.FILMSTREAM_KEYSTORE_BASE64 }}
          FILMSTREAM_STORE_PASSWORD: ${{ secrets.FILMSTREAM_STORE_PASSWORD }}
          FILMSTREAM_KEY_PASSWORD: ${{ secrets.FILMSTREAM_KEY_PASSWORD }}
        run: |
          test -n "$FILMSTREAM_KEYSTORE_BASE64" || { echo 'Missing FILMSTREAM_KEYSTORE_BASE64'; exit 1; }
          test -n "$FILMSTREAM_STORE_PASSWORD" || { echo 'Missing FILMSTREAM_STORE_PASSWORD'; exit 1; }
          test -n "$FILMSTREAM_KEY_PASSWORD" || { echo 'Missing FILMSTREAM_KEY_PASSWORD'; exit 1; }
          python - <<'PY'
          import os, base64, pathlib
          p=pathlib.Path('/tmp/filmstream-release.jks')
          p.write_bytes(base64.b64decode(os.environ['FILMSTREAM_KEYSTORE_BASE64'], validate=True))
          p.chmod(0o600)
          PY
      - name: Build APK
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          LK21_API_BASE: ${{ vars.LK21_API_BASE }}
          SOURCE_API_BASE: ${{ vars.SOURCE_API_BASE }}
          FILMSTREAM_SYNC_KEY: ${{ secrets.FILMSTREAM_SYNC_KEY }}
          FILMSTREAM_KEYSTORE_PATH: /tmp/filmstream-release.jks
          FILMSTREAM_STORE_PASSWORD: ${{ secrets.FILMSTREAM_STORE_PASSWORD }}
          FILMSTREAM_KEY_PASSWORD: ${{ secrets.FILMSTREAM_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$TMDB_TOKEN" || { echo 'Secret TMDB_TOKEN belum diatur'; exit 1; }
          flutter build apk --release --build-number=$((10000 + GITHUB_RUN_NUMBER)) --dart-define="TMDB_TOKEN=$TMDB_TOKEN" --dart-define="LK21_API_BASE=$LK21_API_BASE" --dart-define="SOURCE_API_BASE=$SOURCE_API_BASE" --dart-define="FILMSTREAM_SYNC_KEY=$FILMSTREAM_SYNC_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: Film-Streaming-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
