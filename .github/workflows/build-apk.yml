name: Build FilmStream APK (Tanpa Flutter Create)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pastikan struktur Android permanen sudah ada
        shell: bash
        run: |
          test -s lib/main.dart
          test -f android/gradle/wrapper/gradle-wrapper.properties || { echo 'Jalankan workflow 01 - Siapkan Android Permanen terlebih dahulu'; exit 1; }
          test -f android/app/build.gradle.kts -o -f android/app/build.gradle
      - name: Install dependency
        run: flutter pub get
      - name: Build APK
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        shell: bash
        run: |
          test -n "$TMDB_TOKEN" || { echo 'Secret TMDB_TOKEN belum diatur'; exit 1; }
          flutter build apk --release --dart-define="TMDB_TOKEN=$TMDB_TOKEN"
      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmStream-Personal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
