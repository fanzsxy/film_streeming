name: Build FilmStream APK V5 (Android Permanen)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Periksa Android permanen
        shell: bash
        run: |
          test -s lib/main.dart
          test -f android/gradle/wrapper/gradle-wrapper.properties || { echo 'Struktur Android lengkap belum ada. Jalankan workflow migrasi satu kali dahulu.'; exit 1; }
          test -f android/app/build.gradle.kts -o -f android/app/build.gradle
      - name: Install dependensi dan cek sintaks
        run: |
          flutter pub get
          dart format --output=none lib/main.dart lib/source_manager.dart lib/web_source_page.dart
      - name: Build APK
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          LK21_API_BASE: ${{ vars.LK21_API_BASE }}
          SOURCE_API_BASE: ${{ vars.SOURCE_API_BASE }}
          FILMSTREAM_SYNC_KEY: ${{ secrets.FILMSTREAM_SYNC_KEY }}
        shell: bash
        run: |
          test -n "$TMDB_TOKEN" || { echo 'Secret TMDB_TOKEN belum diatur'; exit 1; }
          flutter build apk --release --dart-define="TMDB_TOKEN=$TMDB_TOKEN" --dart-define="LK21_API_BASE=$LK21_API_BASE" --dart-define="SOURCE_API_BASE=$SOURCE_API_BASE" --dart-define="FILMSTREAM_SYNC_KEY=$FILMSTREAM_SYNC_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: FilmStream-V4-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
