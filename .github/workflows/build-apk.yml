
name: Build FilmStream APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter Android scaffolding and overlay source
        run: |
          mkdir -p /tmp/filmstream-source
          cp pubspec.yaml /tmp/filmstream-source/pubspec.yaml
          cp lib/main.dart /tmp/filmstream-source/main.dart
          cp android/app/src/main/AndroidManifest.xml /tmp/filmstream-source/AndroidManifest.xml
          flutter create --platforms=android --org com.example --project-name filmstream_personal .
          cp /tmp/filmstream-source/pubspec.yaml pubspec.yaml
          cp /tmp/filmstream-source/main.dart lib/main.dart
          cp /tmp/filmstream-source/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          test -n "$TMDB_TOKEN" || { echo 'Repository secret TMDB_TOKEN belum diatur'; exit 1; }
          flutter build apk --release --dart-define="TMDB_TOKEN=$TMDB_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmStream-Personal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
