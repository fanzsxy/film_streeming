name: Build Film Streaming Windows Desktop
on:
  workflow_dispatch:
    inputs:
      personal_installer:
        description: 'Build unsigned installer for personal testing (not trusted or for public distribution)'
        type: boolean
        required: true
        default: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows desktop runner
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name filmstream_personal .
      - name: Brand Windows executable and title
        shell: pwsh
        run: |
          $cmake = "windows/CMakeLists.txt"
          $text = Get-Content $cmake -Raw
          $text = $text.Replace('set(BINARY_NAME "filmstream_personal")', 'set(BINARY_NAME "film_streaming")')
          if ($text -notmatch 'set\(BINARY_NAME "film_streaming"\)') { throw "Unable to update Windows CMake executable name" }
          Set-Content $cmake $text -Encoding UTF8
          $main = "windows/runner/main.cpp"
          $text = Get-Content $main -Raw
          $text = $text.Replace('L"filmstream_personal"', 'L"Film Streaming"')
          Set-Content $main $text -Encoding UTF8
          $rc = "windows/runner/Runner.rc"
          $text = Get-Content $rc -Raw
          $text = $text.Replace('filmstream_personal', 'Film Streaming')
          Set-Content $rc $text -Encoding UTF8
      - name: Generate Film Streaming Windows icon
        shell: pwsh
        run: |
          python -m pip install "Pillow==11.3.0"
          python tools/generate_windows_icon.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows desktop
        shell: pwsh
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          LK21_API_BASE: ${{ vars.LK21_API_BASE }}
          SOURCE_API_BASE: ${{ vars.SOURCE_API_BASE }}
          FILMSTREAM_SYNC_KEY: ${{ secrets.FILMSTREAM_SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TMDB_TOKEN)) { throw 'TMDB_TOKEN secret is required.' }
          flutter build windows --release --dart-define="TMDB_TOKEN=$env:TMDB_TOKEN" --dart-define="LK21_API_BASE=$env:LK21_API_BASE" --dart-define="SOURCE_API_BASE=$env:SOURCE_API_BASE" --dart-define="FILMSTREAM_SYNC_KEY=$env:FILMSTREAM_SYNC_KEY"
      - name: Sign Windows application (trusted certificate required for release)
        id: signing
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PASSWORD)) {
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "No Windows Authenticode certificate configured. Only the explicitly opted-in personal unsigned installer may be created."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "filmstream-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\\Windows Kits\\10\\bin" -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -like '*\\x64\\signtool.exe' } |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw "Windows SDK SignTool not found" }
            $exe = "build/windows/x64/runner/Release/film_streaming.exe"
            & $signTool sign /f $certPath /p $env:WINDOWS_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
            & $signTool verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "Application signature verification failed" }
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } finally {
            Remove-Item $certPath -ErrorAction SilentlyContinue
          }
      - name: Package portable Windows app
        shell: pwsh
        run: |
          $output = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$output/film_streaming.exe")) { throw "Windows exe not found in $output" }
          Compress-Archive -Path "$output/*" -DestinationPath "Film-Streaming-Windows.zip" -Force
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows setup installer
        if: steps.signing.outputs.signed == 'true' || inputs.personal_installer == true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "windows_installer\\filmstream.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed ($LASTEXITCODE)" }
          if (-not (Test-Path "installer-output\\Film-Streaming-Setup.exe")) { throw "Installer output not found" }
      - name: Sign and verify Windows installer
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "filmstream-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\\Windows Kits\\10\\bin" -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -like '*\\x64\\signtool.exe' } |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw "Windows SDK SignTool not found" }
            $installer = "installer-output/Film-Streaming-Setup.exe"
            & $signTool sign /f $certPath /p $env:WINDOWS_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer
            if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }
            & $signTool verify /pa /v $installer
            if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed" }
            Get-FileHash $installer -Algorithm SHA256 | Format-List
          } finally {
            Remove-Item $certPath -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed != 'true' && inputs.personal_installer == true
        with:
          name: Film-Streaming-Windows-PERSONAL-UNSIGNED-Installer
          path: installer-output/Film-Streaming-Setup.exe
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: Film-Streaming-Windows-Installer
          path: installer-output/Film-Streaming-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Film-Streaming-Windows-Portable
          path: Film-Streaming-Windows.zip
          if-no-files-found: error
      - name: Warn about unsigned personal installer
        if: steps.signing.outputs.signed != 'true' && inputs.personal_installer == true
        shell: pwsh
        run: |
          Write-Warning "UNSIGNED PERSONAL BUILD: Chrome and Windows can block this artifact. Do not disable security protections. This build is for testing, not public distribution."
          "### Unsigned installer for personal testing only" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "This installer is **not Authenticode signed** and is not guaranteed safe or trusted by Chrome/Windows. Do not bypass security warnings. Check repository and build provenance and scan before using." | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Publish SHA256 checksums
        shell: pwsh
        run: |
          Get-FileHash "Film-Streaming-Windows.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Film-Streaming-Windows.zip" } |
            Set-Content "SHA256SUMS.txt"
          if (Test-Path "installer-output/Film-Streaming-Setup.exe") {
            Get-FileHash "installer-output/Film-Streaming-Setup.exe" -Algorithm SHA256 |
              ForEach-Object { "$($_.Hash.ToLower())  Film-Streaming-Setup.exe" } |
              Add-Content "SHA256SUMS.txt"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Film-Streaming-Windows-Checksums
          path: SHA256SUMS.txt
          if-no-files-found: error
