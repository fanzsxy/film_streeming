name: Audit and Fill Only Empty Catalog Genres

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '0 = audit only; 25/100/500/1000 = search only entries with empty genres'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '25'
          - '100'
          - '500'
          - '1000'
      auto_continue:
        description: 'Automatically process next 500 truly empty entries (after pilot review)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: filmstream-metadata-write
  cancel-in-progress: false

jobs:
  fill-empty-genres:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile tools/recover_empty_catalog_genres.py tools/third_pass_catalog_genres.py tools/retry_catalog_genres.py
      - name: Audit and optionally recover empty genres
        id: recover
        env:
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          python tools/recover_empty_catalog_genres.py --limit "$LIMIT" --delay 0.35 --github-output "$GITHUB_OUTPUT"
      - name: Commit catalog updates (never overwrite existing genres)
        if: ${{ inputs.limit != '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog/filmstream_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Recover only truly empty catalog genres"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No catalog changes."
          fi
      - name: Continue next 500 empty-genre entries
        if: ${{ inputs.auto_continue == true && inputs.limit != '0' && steps.recover.outputs.pending != '0' && steps.recover.outputs.attempted != '0' && steps.recover.outputs.paused == 'false' }}
        run: gh workflow run audit-empty-catalog-genres.yml --ref main -f limit=500 -f auto_continue=true
