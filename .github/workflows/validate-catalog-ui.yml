name: Validate Catalog UI Integration

on:
  pull_request:
    paths:
      - 'lib/catalog_query.dart'
      - 'lib/filmstream_catalog.dart'
      - 'lib/main.dart'
      - 'lib/windows_poster_reveal_gate.dart'
      - 'lib/catalog_poster_display.dart'
      - 'lib/filmstream_icons.dart'
      - 'lib/windows_navigation.dart'
      - 'lib/windows_episode_selector.dart'
      - 'lib/filmstream_detail_metadata.dart'
      - 'lib/windows_source_player.dart'
      - 'lib/windows_fullscreen_coordinator.dart'
      - 'lib/windows_season_picker.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/startup_catalog_check.dart'
      - 'lib/catalog_sync_diagnostics.dart'
      - 'lib/catalog_scan_helpers.dart'
      - 'lib/search_suggestions.dart'
      - 'test/catalog_query_test.dart'
      - 'test/search_suggestions_test.dart'
      - 'test/catalog_scan_helpers_test.dart'
      - 'test/catalog_sync_diagnostics_test.dart'
      - 'test/filmstream_icons_test.dart'
      - 'test/catalog_poster_display_test.dart'
      - 'test/windows_navigation_test.dart'
      - 'test/windows_fullscreen_coordinator_test.dart'
      - 'test/windows_episode_selector_test.dart'
      - 'test/windows_poster_reveal_gate_test.dart'
      - 'test/filmstream_detail_metadata_test.dart'
      - '.github/workflows/validate-catalog-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get Flutter packages
        run: flutter pub get
      - name: Analyze changed Dart files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/catalog_query.dart lib/filmstream_catalog.dart lib/main.dart lib/search_suggestions.dart lib/startup_catalog_check.dart lib/catalog_scan_helpers.dart lib/catalog_sync_diagnostics.dart lib/filmstream_icons.dart lib/windows_navigation.dart lib/filmstream_detail_metadata.dart lib/windows_source_player.dart lib/windows_season_picker.dart lib/catalog_poster_display.dart lib/windows_poster_reveal_gate.dart lib/windows_episode_selector.dart lib/windows_fullscreen_coordinator.dart
      - name: Test catalog search, categories, filter and pagination
        run: |
          flutter test test/catalog_query_test.dart
          flutter test test/search_suggestions_test.dart
          flutter test test/catalog_numbered_pagination_test.dart
          flutter test test/filter_completed_pages_test.dart
          flutter test test/catalog_scan_helpers_test.dart
          flutter test test/catalog_sync_diagnostics_test.dart
          flutter test test/filmstream_icons_test.dart
          flutter test test/catalog_poster_display_test.dart
          flutter test test/windows_poster_reveal_gate_test.dart
          flutter test test/windows_navigation_test.dart
          flutter test test/windows_fullscreen_coordinator_test.dart
          flutter test test/windows_episode_selector_test.dart
          flutter test test/filmstream_detail_metadata_test.dart
