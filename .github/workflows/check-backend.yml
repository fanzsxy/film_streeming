name: Backend Python syntax check

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/import_phone_catalog.py'
      - 'tests/test_phone_catalog_submission_dedup.py'
      - 'tests/test_phone_catalog_import_genres.py'
      - 'tests/test_sync_secret_build_config.py'
      - 'lib/startup_catalog_check.dart'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/check-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tools/import_phone_catalog.py'
      - 'tests/test_phone_catalog_submission_dedup.py'
      - 'tests/test_phone_catalog_import_genres.py'
      - '.github/workflows/check-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check backend Python syntax
        run: python -m compileall -q backend
      - name: Import API application and verify catalog route registration
        run: |
          python -m pip install -r backend/requirements.txt
          cd backend
          python -c "from phone_catalog_sync import router; assert any(getattr(route, 'path', None) == '/catalog/submit' for route in router.routes)"
      - name: Test phone catalog submissions, genres and approved imports
        run: |
          python -m py_compile tools/import_phone_catalog.py
          python -m unittest discover -s tests -p 'test_phone_catalog_submission_dedup.py' -v
          python -m unittest discover -s tests -p 'test_phone_catalog_import_genres.py' -v
          python -m unittest discover -s tests -p 'test_sync_secret_build_config.py' -v
