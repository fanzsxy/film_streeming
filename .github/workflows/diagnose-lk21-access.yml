name: Diagnose LK21 catalog access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check one catalog request without crawling
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.error
          import urllib.request
          urls = [
              "https://tv12.lk21official.cc/robots.txt",
              "https://tv12.lk21official.cc/latest",
          ]
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "FilmStreamMetadataIndexer/1.0"})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      print(f"{url}: HTTP {response.status}; content-type={response.headers.get('Content-Type','unknown')}")
              except urllib.error.HTTPError as error:
                  print(f"{url}: HTTP {error.code}")
              except Exception as error:
                  print(f"{url}: {type(error).__name__}: {error}")
          PY
