name: Fill Genres in Main Catalog

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'TMDB detail requests per run (0 = cached-only)'
        required: true
        default: '100'
        type: choice
        options:
          - '0'
          - '50'
          - '100'
          - '200'
          - '500'

permissions:
  contents: write

concurrency:
  group: filmstream-metadata-write
  cancel-in-progress: false

jobs:
  fill-genres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fill genre IDs in filmstream_catalog.json
        run: python tools/fill_catalog_genres.py --limit ${{ inputs.limit }} --delay 0.35
      - name: Commit catalog only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog/filmstream_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Populate verified genre IDs in main catalog"
            git push
          fi
