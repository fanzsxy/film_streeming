name: FilmStream TMDB Metadata Sync

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of new series TMDB lookups (max 1000)'
        required: true
        default: '100'
        type: choice
        options:
          - '25'
          - '50'
          - '100'
          - '200'
          - '500'
          - '1000'

permissions:
  contents: write

concurrency:
  group: filmstream-metadata-write
  cancel-in-progress: false

jobs:
  match-series:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify TMDB token
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::Missing repository secret TMDB_TOKEN"
            exit 1
          fi

      - name: Validate and normalize metadata cache
        run: python tools/validate_tmdb_cache.py

      - name: Match series against TMDB
        run: python tools/enrich_tmdb.py --type series --limit ${{ inputs.limit }} --delay 0.35

      - name: Retry unmatched series with strict alternate-title validation
        run: python tools/retry_unmatched_tmdb.py --limit ${{ inputs.limit }} --delay 0.5

      - name: Fetch Indonesian synopses for cached matches
        run: python tools/localize_tmdb.py --limit ${{ inputs.limit }} --delay 0.35

      - name: Translate a small batch of remaining English synopses
        run: python tools/translate_missing_synopsis.py --limit 20 --delay 2.5

      - name: Update bundled catalog from cached matches
        run: python tools/prepare_app_catalog.py

      - name: Overall TMDB and Indonesian synopsis progress
        if: always()
        run: python tools/tmdb_progress.py

      - name: Commit metadata cache and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog/tmdb_cache.jsonl assets/catalog/filmstream_catalog.json
          if git diff --cached --quiet; then
            echo "No new metadata changes."
          else
            git commit -m "Sync offline series TMDB metadata"
            git push
          fi
