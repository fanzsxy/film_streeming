name: LK21 2015-2025 movie catalog discovery with TMDB

on:
  workflow_dispatch:
    inputs:
      pages_per_year:
        description: Pages to check for each year (1-20)
        type: choice
        required: true
        default: '3'
        options: ['1', '3', '5', '10', '20']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lk21-year-tmdb-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r crawler/requirements.txt
      - name: Validate collector
        run: python -m unittest discover -s tests -p 'test_lk21_year_tmdb.py' -v
      - name: Crawl LK21 year listings and verify titles in TMDB
        run: python -m tools.discover_lk21_years_tmdb --start-year 2015 --end-year 2025 --pages-per-year ${{ inputs.pages_per_year }}
      - name: Upload report (including restricted pages and unmatched titles)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lk21-2015-2025-tmdb-report
          path: crawler/data/lk21_year_tmdb_report.json
          if-no-files-found: ignore
      - name: Propose catalog additions for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: assets/catalog/filmstream_catalog.json
          branch: automation/lk21-2015-2025-movies
          delete-branch: true
          commit-message: 'catalog: propose TMDB-verified LK21 movie titles 2015-2025'
          title: 'Catalog: review LK21 movie discoveries (2015-2025)'
          body: |
            Adds only movies observed on accessible public LK21 year pages that have
            an unambiguous TMDB title/year match and are absent from the catalog.
            Existing entries remain unchanged. Review all new titles and URLs.
            Only metadata is collected; no playback/download links.
