name: Crawl LK21 public metadata
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1,4"
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r crawler/requirements.txt
      - run: python crawler/crawl.py --pages 10 --delay 3
      - name: Commit catalog progress
        run: |
          if [ -n "$(git status --porcelain -- crawler/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crawler/data
            git commit -m "Update LK21 metadata catalog"
            git push
          fi
