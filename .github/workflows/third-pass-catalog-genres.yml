name: Recover Genres With Alternate Titles

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Titles to verify this batch (start with 25 for pilot)'
        required: true
        default: '25'
        type: choice
        options:
          - '25'
          - '50'
          - '100'
      auto_continue:
        description: 'Continue automatically after this batch (enable only after pilot review)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: filmstream-metadata-write
  cancel-in-progress: false

jobs:
  recover-genres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile tools/third_pass_catalog_genres.py tools/retry_catalog_genres.py
      - name: Verify missing genre matches (third pass)
        id: recover
        env:
          LIMIT: ${{ github.event.inputs.limit || '25' }}
        run: |
          python tools/third_pass_catalog_genres.py --limit "$LIMIT" --delay 0.35 --github-output "$GITHUB_OUTPUT"
      - name: Save verified results into main catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog/filmstream_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Recover verified third-pass TMDB genre metadata"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No metadata/status changes."
          fi
      - name: Automatically check next 100 titles
        if: ${{ inputs.auto_continue == true && steps.recover.outputs.pending != '0' && steps.recover.outputs.attempted != '0' && steps.recover.outputs.paused == 'false' }}
        run: gh workflow run third-pass-catalog-genres.yml --ref main -f limit=100 -f auto_continue=true
      - name: Report completion
        if: ${{ steps.recover.outputs.pending == '0' }}
        run: echo "Third pass finished. Unmatched, ambiguous, invalid-year or no-genre entries still require manual review."
