name: 01 - Siapkan Android Permanen (Sekali Saja)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Buat file Android hanya sekali
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.yaml
          test -s lib/main.dart
          test -s android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ] || [ -f android/app/build.gradle ]; then
            echo 'Gradle Android sudah ada; tidak membuat ulang.'
          else
            cp android/app/src/main/AndroidManifest.xml /tmp/filmstream-AndroidManifest.xml
            flutter create --platforms=android --org com.example --project-name filmstream_personal .
            cp /tmp/filmstream-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          flutter pub get
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/settings.gradle.kts -o -f android/settings.gradle
          test -f android/app/build.gradle.kts -o -f android/app/build.gradle
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f android .metadata
          git add pubspec.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Tidak ada perubahan.'
          else
            git commit -m 'Simpan Android dan Gradle permanen'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
